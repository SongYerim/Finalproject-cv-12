name: sidae_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  # 환경 변수 관리 (.env)
  flutter_dotenv: ^5.1.0
  # 서버 통신용 
  http: ^1.1.0
  # 위치 추적 (기획서 3.1) [cite: 25, 58]
  geolocator: ^10.1.0
  # 음성 인식 (STT) [cite: 25, 28]
  speech_to_text: ^7.0.0
  # 권한 관리 (위치, 마이크 권한 요청용)
  permission_handler: ^11.0.1
  # 파일 시스템 경로 접근
  path_provider: ^2.1.0
  # 음성 안내 (TTS) - 안내 멘트 출력용
  flutter_tts: ^3.8.3
  # 네이버 맵
  flutter_naver_map: ^1.3.0
  # 카메라 (YOLO 테스트용)
  camera: ^0.11.0
  # 이미지 처리
  image: ^4.0.0
  # TFLite (온디바이스 YOLO 추론)
  tflite_flutter: ^0.11.0

  animated_splash_screen: ^1.3.0
  page_transition: ^2.1.0

  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  sensors_plus: ^6.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 환경 변수 파일 등록
  assets:
    - .env
    - assets/sidae_logo.png # 앱 아이콘
    - assets/route_data.json
    - assets/route_data_2.json
    - assets/yolo26n_float16.tflite # YOLO26n FP16 (2026 최신, 경량화)
    - assets/coco_labels.txt # COCO 라벨